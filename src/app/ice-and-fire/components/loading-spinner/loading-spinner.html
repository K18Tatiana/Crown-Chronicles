<div class="flex flex-col items-center justify-center py-8">
  <div class="animate-spin rounded-full border-b-2 border-got-red" [class]="sizeClass"></div>
  @if (showMessage() && message()) {
    <p class="mt-4 text-gray-600 dark:text-gray-400" [class]="messageSize">
      {{ message() }}
    </p>
  }
</div>
