@if (showPagination) {
  <div class="flex justify-center items-center gap-2 mt-8">
    <!-- Botón Anterior -->
    <button
      (click)="previousPage()"
      [disabled]="!hasPrevious"
      class="px-3 py-2 text-sm font-medium text-gray-500 bg-white border border-gray-300 rounded-md hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed dark:bg-gray-800 dark:border-gray-600 dark:text-gray-400 dark:hover:bg-gray-700">
      Anterior
    </button>
    
    <!-- Páginas numeradas -->
    <div class="flex gap-1">
      @for (page of getVisiblePages(); track page) {
        <button
          (click)="goToPage(page)"
          [class]="page === currentPage() ? 'bg-red-600 text-white' : 'text-gray-700 bg-white hover:bg-gray-50 dark:text-gray-400 dark:bg-gray-800 dark:hover:bg-gray-700'"
          class="px-3 py-2 text-sm font-medium border border-gray-300 rounded-md dark:border-gray-600">
          {{ page }}
        </button>
      }
    </div>

    <!-- Botón Siguiente -->
    <button
      (click)="nextPage()"
      [disabled]="!hasNext"
      class="px-3 py-2 text-sm font-medium text-gray-500 bg-white border border-gray-300 rounded-md hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed dark:bg-gray-800 dark:border-gray-600 dark:text-gray-400 dark:hover:bg-gray-700">
      Siguiente
    </button>
  </div>

  <!-- Información de paginación -->
  <div class="flex justify-center mt-4">
    <div class="text-sm text-gray-600 dark:text-gray-400">
      Página {{ currentPage() }} de {{ totalPages }} 
      ({{ totalItems() }} elementos totales)
    </div>
  </div>
}
